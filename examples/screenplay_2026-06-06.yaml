screenplay:
  meta:
    title: '尘封的真相'
    genre: '悬疑剧情'
    author: '未知'
    adapter: 'Novel-to-Screenplay AI'
    version: '1.0'
    logline: '记者林晚舟回乡探寻父亲非正常死亡真相，揭开小镇开发项目背后的惊天暗账。'

  characters:
    - name: '林晚舟'
      role: 'protagonist'
      description: '年轻女记者，敏锐执着，为查明父亲死亡真相回到故乡。'
    - name: '顾明川'
      role: 'supporting'
      description: '四十多岁西装男，林父同事，受托保管遗物与线索，行事谨慎。'
    - name: '外公'
      role: 'supporting'
      description: '白发苍苍的老人，林晚舟的外公，隐居老屋，洞察世事。'

  acts:
    - act_number: 1
      title: '第一章 尘封的记忆'
      scenes:
        - scene_id: 'A1S1'
          chapter_source: '第一章'
          location: '江南小镇青石板路/老屋门外'
          time_of_day: 'DAY'
          atmosphere: '深秋午后，阳光斑驳，静谧中透着岁月的沧桑。'
          beats:
            - type: 'action'
              content: '深秋午后，阳光像锈迹斑斑的金币洒在青石板路上。林晚舟拖着行李箱，停在吱呀作响的木门前，深吸一口气，推开门。'
              direction: '镜头跟随林晚舟的视角，展现老屋的破败与熟悉感。'
            - type: 'action'
              content: '扑面而来的是二十年未曾散去的樟木气息。林晚舟环顾四周，眼神复杂。'
        - scene_id: 'A1S2'
          chapter_source: '第一章'
          location: '老屋堂屋'
          time_of_day: 'DAY'
          atmosphere: '昏暗，安静，只有倒茶的水声。'
          beats:
            - type: 'dialogue'
              character: '外公'
              content: '你回来了。'
              direction: '头也没抬，手中的紫砂壶稳稳地注入茶水。'
            - type: 'action'
              content: '林晚舟愣了一下，随即苦笑。'
            - type: 'dialogue'
              character: '林晚舟'
              content: '外公，您怎么知道是我？'
            - type: 'dialogue'
              character: '外公'
              content: '脚步声。二十年了，你的脚步还是当年那个拖鞋走路的小鬼头。'
              direction: '外公放下茶壶，抬眼看向林晚舟，目光深邃。'

    - act_number: 2
      title: '第二章 旧伤未愈'
      scenes:
        - scene_id: 'A2S1'
          chapter_source: '第二章'
          location: '老屋阁楼'
          time_of_day: 'DAY'
          atmosphere: '灰尘飞扬，光线从老虎窗透入，显得压抑。'
          beats:
            - type: 'action'
              content: '三天后。林晚舟在落满灰尘的杂物中翻找，咳了两声，终于拽出一个生锈的铁皮箱子。'
            - type: 'dialogue'
              character: '顾明川'
              content: '你不应该来这里。'
              direction: '声音从身后传来，低沉而严厉。'
            - type: 'action'
              content: '林晚舟猛地回头，手紧紧护住铁皮箱。'
        - scene_id: 'A2S2'
          chapter_source: '第二章'
          location: '老屋阁楼'
          time_of_day: 'DAY'
          atmosphere: '紧张，对峙。'
          beats:
            - type: 'action'
              content: '门口站着一个四十多岁的男人顾明川，穿着笔挺的西装，与破旧阁楼格格不入。'
            - type: 'dialogue'
              character: '顾明川'
              content: '我叫顾明川，你父亲的同事，也是他临死前托付的人。'
              direction: '从怀里取出一个泛黄的信封。'
            - type: 'dialogue'
              character: '顾明川'
              content: '这封信，等你自己来拿的那一天，才能交给你。'
            - type: 'action'
              content: '林晚舟缓缓抬头，眼眶泛红，接过信封。'
            - type: 'dialogue'
              character: '林晚舟'
              content: '他说，他不是自杀的。'
              direction: '声音颤抖，带着压抑的愤怒与悲伤。'

    - act_number: 3
      title: '第三章 暗流涌动'
      scenes:
        - scene_id: 'A3S1'
          chapter_source: '第三章'
          location: '镇上茶馆'
          time_of_day: 'DAY'
          atmosphere: '嘈杂的茶馆内，两人角落对坐，气氛凝重。'
          beats:
            - type: 'action'
              content: '林晚舟和顾明川相对而坐，周围茶客喧闹，但他们仿佛处于孤岛。'
            - type: 'dialogue'
              character: '顾明川'
              content: '你相信他写的？'
              direction: '声音压得极低，身体前倾。'
            - type: 'dialogue'
              character: '林晚舟'
              content: '我相信我的父亲。他做了二十年会计，从来一丝不苟。'
              direction: '眼神坚定，直视顾明川。'
            - type: 'dialogue'
              character: '顾明川'
              content: '林工走之前，发现了一笔账目问题，涉及到镇上的陈家开发项目……'
        - scene_id: 'A3S2'
          chapter_source: '第三章'
          location: '镇上茶馆'
          time_of_day: 'DAY'
          atmosphere: '暗流涌动，危机感逼近。'
          beats:
            - type: 'dialogue'
              character: '林晚舟'
              content: '我是记者。顾先生，你今天来，不只是为了送信吧？'
              direction: '敏锐地捕捉到顾明川的言外之意。'
            - type: 'action'
              content: '顾明川低下头，手指摩挲着茶杯边缘。'
            - type: 'dialogue'
              character: '顾明川'
              content: '林工生前拷贝了文件，只有你才能找到。'
            - type: 'dialogue'
              character: '林晚舟'
              content: '告诉我在哪里。'
              direction: '语气不容置疑，双手紧握成拳。'
